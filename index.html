    <!-- GitHub Pages Single Page App routing restoration -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search.startsWith('?/')) {
          var decoded = l.search.slice(2).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.replace(/\/+$/, '') + '/' + decoded + l.hash
          );
        }
      }(window.location));
    </script>
